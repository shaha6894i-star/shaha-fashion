
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management - Shaha Fashion</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: block;
      padding: 15px;
    }

    .product-panel {
      max-width: 650px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 12px;
    }

    .product-panel input,
    .product-panel textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 15px;
    }

    .product-panel button {
      margin-bottom: 12px;
    }

    .product-item {
      border: 1px solid #ddd;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
    }

    .product-item img {
      width: 90px;
      height: 90px;
      object-fit: cover;
    }

    .delete-btn {
      background: #dc2626;
    }
  </style>
</head>
<body>

<div class="product-panel">
  <h1>Product Management</h1>
  <p>Add, edit and delete products</p>

  <form id="productForm">
    <input id="productName" placeholder="Product Name" required>
    <input id="productPrice" type="number" min="0" step="0.01"
      placeholder="Product Price" required>
    <input id="productImage" type="url" placeholder="Image URL" required>
    <textarea id="productDescription"
      placeholder="Product Description"></textarea>

    <button type="submit" id="saveBtn">Add Product</button>
    <button type="button" id="cancelEdit"
      style="display:none;background:#666">Cancel Edit</button>
  </form>

  <p id="message"></p>
  <h2>All Products</h2>
  <div id="productList">Loading products...</div>

  <p><a href="dashboard.html">Back to Dashboard</a></p>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    collection, addDoc, getDocs, updateDoc,
    deleteDoc, doc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const ADMIN_UID = "Rr70hIlAWRNE6CTLhBQvvNIuop72";
  const form = document.getElementById("productForm");
  const list = document.getElementById("productList");
  const message = document.getElementById("message");
  const saveBtn = document.getElementById("saveBtn");
  const cancelEdit = document.getElementById("cancelEdit");

  let editingId = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user || user.uid !== ADMIN_UID) {
      location.href = "index.html";
      return;
    }
    await loadProducts();
  });

  async function loadProducts() {
    list.textContent = "Loading...";
    try {
      const snapshot = await getDocs(collection(db, "products"));
      list.innerHTML = "";

      if (snapshot.empty) {
        list.textContent = "No products added yet.";
        return;
      }

      snapshot.forEach((item) => {
        const p = item.data();
        const div = document.createElement("div");
        div.className = "product-item";

        const img = document.createElement("img");
        img.src = p.image || "";
        img.alt = p.name || "Product";

        const title = document.createElement("h3");
        title.textContent = p.name || "";

        const price = document.createElement("p");
        price.textContent = "Price: ৳" + p.price;

        const description = document.createElement("p");
        description.textContent = p.description || "";

        const edit = document.createElement("button");
        edit.textContent = "Edit";
        edit.onclick = () => startEdit(item.id, p);

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.className = "delete-btn";
        del.onclick = () => removeProduct(item.id);

        div.append(img, title, price, description, edit, del);
        list.appendChild(div);
      });
    } catch (error) {
      list.textContent = "Error: " + error.message;
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const product = {
      name: document.getElementById("productName").value.trim(),
      price: Number(document.getElementById("productPrice").value),
      image: document.getElementById("productImage").value.trim(),
      description: document.getElementById("productDescription").value.trim()
    };

    saveBtn.disabled = true;
    message.textContent = "Saving...";

    try {
      if (editingId) {
        await updateDoc(doc(db, "products", editingId), product);
        message.textContent = "Product updated!";
      } else {
        await addDoc(collection(db, "products"), {
          ...product,
          createdAt: serverTimestamp()
        });
        message.textContent = "Product added!";
      }

      form.reset();
      editingId = null;
      saveBtn.textContent = "Add Product";
      cancelEdit.style.display = "none";
      await loadProducts();

    } catch (error) {
      message.textContent = "Error: " + error.message;
    } finally {
      saveBtn.disabled = false;
    }
  });

  function startEdit(id, p) {
    editingId = id;
    document.getElementById("productName").value = p.name || "";
    document.getElementById("productPrice").value = p.price || "";
    document.getElementById("productImage").value = p.image || "";
    document.getElementById("productDescription").value = p.description || "";
    saveBtn.textContent = "Update Product";
    cancelEdit.style.display = "block";
    message.textContent = "Editing product...";
    window.scrollTo(0, 0);
  }

  cancelEdit.onclick = () => {
    editingId = null;
    form.reset();
    saveBtn.textContent = "Add Product";
    cancelEdit.style.display = "none";
    message.textContent = "";
  };

  async function removeProduct(id) {
    if (!confirm("Are you sure you want to delete this product?")) return;

    try {
      await deleteDoc(doc(db, "products", id));
      message.textContent = "Product deleted!";
      await loadProducts();
    } catch (error) {
      message.textContent = "Error: " + error.message;
    }
  }
</script>

</body>
  </html>
