<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Management - Shaha Fashion</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f4f5f9;font-family:Arial,sans-serif;color:#222}
.wrap{max-width:750px;margin:auto}
h1{color:#222}
.card{background:white;padding:20px;border-radius:12px;margin:15px 0;box-shadow:0 2px 10px #00000010}
label{display:block;margin:12px 0 5px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;font-size:16px}
textarea{min-height:80px}
button{border:0;padding:11px 16px;border-radius:7px;background:#111;color:white;font-size:15px;margin-top:12px;cursor:pointer}
button.danger{background:#d62828}
button.edit{background:#1769aa;margin-right:6px}
button.secondary{background:#555}
.product{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}
.product img{width:70px;height:70px;object-fit:cover;border-radius:8px;background:#eee}
.product-info{flex:1;min-width:0}
.product-info p{margin:5px 0;color:#666}
#status{font-weight:bold;color:#087a36}
</style>
</head>
<body>
<div class="wrap">
  <h1>Shaha Fashion — Products</h1>
  <p><a href="dashboard.html">← Dashboard এ ফিরে যান</a></p>

  <div class="card">
    <h2 id="formTitle">নতুন পণ্য যোগ করুন</h2>
    <form id="productForm">
      <label>পণ্যের নাম</label>
      <input id="productName" required placeholder="যেমন: Classic Shirt">

      <label>দাম (টাকা)</label>
      <input id="productPrice" type="number" min="0" required placeholder="যেমন: 850">

      <label>ক্যাটাগরি</label>
      <select id="productCategory" required>
        <option value="">ক্যাটাগরি নির্বাচন করুন</option>
        <option value="ফ্যাশন">ফ্যাশন</option>
        <option value="গ্যাজেট">গ্যাজেট</option>
        <option value="বিউটি">বিউটি</option>
        <option value="লাইফস্টাইল">লাইফস্টাইল</option>
      </select>

      <label>ছবির URL</label>
      <input id="productImage" type="url" required placeholder="https://example.com/image.jpg">

      <label>পণ্যের বিবরণ</label>
      <textarea id="productDescription" placeholder="পণ্যের বিবরণ লিখুন"></textarea>

      <button type="submit" id="saveButton">পণ্য যোগ করুন</button>
      <button type="button" class="secondary" id="cancelButton" style="display:none">এডিট বাতিল</button>
    </form>
    <p id="status"></p>
  </div>

  <div class="card">
    <h2>আপনার পণ্যসমূহ</h2>
    <div id="productList">লোড হচ্ছে...</div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  collection, addDoc, getDocs, updateDoc, deleteDoc, doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ADMIN_UID = "Rr70hIlAWRNE6CTLhBQvvNIuop72";
const form = document.getElementById("productForm");
const statusText = document.getElementById("status");
const list = document.getElementById("productList");
const saveButton = document.getElementById("saveButton");
const cancelButton = document.getElementById("cancelButton");

let editingId = null;

const $ = id => document.getElementById(id);

function message(text, error=false) {
  statusText.textContent = text;
  statusText.style.color = error ? "#c62828" : "#087a36";
}

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function resetForm() {
  form.reset();
  editingId = null;
  $("formTitle").textContent = "নতুন পণ্য যোগ করুন";
  saveButton.textContent = "পণ্য যোগ করুন";
  cancelButton.style.display = "none";
}

cancelButton.addEventListener("click", resetForm);

onAuthStateChanged(auth, user => {
  if (!user || user.uid !== ADMIN_UID) {
    location.href = "./index.html";
    return;
  }
  loadProducts();
});

async function loadProducts() {
  list.textContent = "পণ্য লোড হচ্ছে...";
  try {
    const snapshot = await getDocs(collection(db, "products"));
    if (snapshot.empty) {
      list.textContent = "এখনো কোনো পণ্য যোগ করা হয়নি।";
      return;
    }

    list.innerHTML = "";
    snapshot.forEach(item => {
      const p = item.data();
      const row = document.createElement("div");
      row.className = "product";
      row.innerHTML = `
        <img src="${safeText(p.image)}" alt="" onerror="this.style.display='none'">
        <div class="product-info">
          <strong>${safeText(p.name)}</strong>
          <p>৳${safeText(p.price)} · ${safeText(p.category || "ক্যাটাগরি নেই")}</p>
          <button class="edit" data-edit="${item.id}">এডিট</button>
          <button class="danger" data-delete="${item.id}">ডিলিট</button>
        </div>`;
      list.appendChild(row);
    });

    list.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => editProduct(btn.dataset.edit));
    });
    list.querySelectorAll("[data-delete]").forEach(btn => {
      btn.addEventListener("click", () => removeProduct(btn.dataset.delete));
    });
  } catch (error) {
    console.error(error);
    list.textContent = "পণ্য লোড করা যায়নি। ইন্টারনেট ও Firebase Rules পরীক্ষা করুন।";
  }
}

async function editProduct(id) {
  try {
    const snapshot = await getDocs(collection(db, "products"));
    const found = snapshot.docs.find(item => item.id === id);
    if (!found) return;

    const p = found.data();
    $("productName").value = p.name || "";
    $("productPrice").value = p.price || "";
    $("productCategory").value = p.category || "";
    $("productImage").value = p.image || "";
    $("productDescription").value = p.description || "";

    editingId = id;
    $("formTitle").textContent = "পণ্য এডিট করুন";
    saveButton.textContent = "পরিবর্তন সংরক্ষণ করুন";
    cancelButton.style.display = "inline-block";
    window.scrollTo({top:0, behavior:"smooth"});
  } catch (error) {
    message("এডিট করা যায়নি: " + error.message, true);
  }
}

async function removeProduct(id) {
  if (!confirm("এই পণ্যটি ডিলিট করতে চান?")) return;
  try {
    await deleteDoc(doc(db, "products", id));
    message("পণ্য ডিলিট হয়েছে।");
    loadProducts();
  } catch (error) {
    message("ডিলিট করা যায়নি: " + error.message, true);
  }
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  saveButton.disabled = true;
  message("সংরক্ষণ হচ্ছে...");

  const product = {
    name: $("productName").value.trim(),
    price: Number($("productPrice").value),
    category: $("productCategory").value,
    image: $("productImage").value.trim(),
    description: $("productDescription").value.trim()
  };

  try {
    if (editingId) {
      await updateDoc(doc(db, "products", editingId), product);
      message("পণ্যের পরিবর্তন সংরক্ষণ হয়েছে।");
    } else {
      product.createdAt = serverTimestamp();
      await addDoc(collection(db, "products"), product);
      message("নতুন পণ্য যোগ হয়েছে।");
    }
    resetForm();
    await loadProducts();
  } catch (error) {
    console.error(error);
    message("সমস্যা হয়েছে: " + error.message, true);
  } finally {
    saveButton.disabled = false;
  }
});
</script>
</body>
</html>
